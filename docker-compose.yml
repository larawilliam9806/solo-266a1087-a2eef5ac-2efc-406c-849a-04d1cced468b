services:
  api:
    build: .
    image: bangdan-marker-service:latest
    container_name: bangdan-api
    ports:
      # Host port defaults to 8000; override with HOST_PORT=8080.
      - "${HOST_PORT:-8000}:8000"
    environment:
      # SQLite database path inside the container (see volume below).
      DB_PATH: /data/bangdan.db
      LOG_LEVEL: INFO
      # To auto-import the current templates+markers on first boot, put your
      # JSON at ./seed/current_templates.json and uncomment:
      # SEED_FILE: /app/seed/current_templates.json
    volumes:
      # Bind mount so the SQLite config file is visible on the host at ./data.
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
